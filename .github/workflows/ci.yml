name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Settings() in app/core/config.py requires these three values at import
    # time. Tests use in-memory SQLite (see app/tests/conftest.py), so the
    # DATABASE_URL value itself is never connected to — it only needs to exist.
    env:
      DATABASE_URL: "sqlite:///./ci.db"
      SECRET_KEY: "ci-test-secret-key"
      ADMIN_SIGNUP_KEY: "ci-admin-key"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest --tb=short
